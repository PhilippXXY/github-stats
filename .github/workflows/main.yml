name: Generate Stats Images

on:
  push:
    branches:
      - master
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-stats-images
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6

    - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2 tag
      with:
        version: 0.16.0

    - name: Build and test
      run: |
        zig build
        zig build test
        bash tests/smoke.sh

    - name: Generate images
      run: |
        if [[ -z "$ACCESS_TOKEN" ]]; then
          echo '::error::Set the ACCESS_TOKEN repository secret with read:user, user:email and repo permissions.'
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/github-stats-output"
        cd "$RUNNER_TEMP/github-stats-output"
        "$GITHUB_WORKSPACE/zig-out/bin/github-stats"
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS || secrets.EXCLUDED }}
        EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS || secrets.EXCLUDED_LANGS }}
        EXCLUDE_PRIVATE: "false"
        SILENT: "true"
        # TODO: Remove this when they get their API working again
        # https://github.com/orgs/community/discussions/192970
        MAX_RETRIES: 5

    - name: Publish images
      run: |
        generated_branch=$(git ls-remote --heads origin generated)
        if [[ -n "$generated_branch" ]]; then
          git fetch --no-tags --depth=1 origin generated
          git checkout -B generated FETCH_HEAD
        else
          git checkout --orphan generated
          git rm -rf .
        fi
        cp "$RUNNER_TEMP/github-stats-output/overview.svg" .
        cp "$RUNNER_TEMP/github-stats-output/languages.svg" .
        git add overview.svg languages.svg
        if git diff --cached --quiet; then
          exit 0
        fi
        git config user.name "jstrieb/github-stats"
        git config user.email "github-stats[bot]@jstrieb.github.io"
        git commit -m 'Update generated files'
        git push origin HEAD:generated
